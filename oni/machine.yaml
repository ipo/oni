# ONI machine database — regenerated from current game files via
# tools/extract_oni_data.py (see oni/data/buildings.json and recipes.json).
#
# Conventions:
# - Rates are kg/s at 100% uptime. Power in watts. Heat in DTU/s.
# - Heat is building self+exhaust heat only; heat carried by produced
#   elements is not modeled (but hot-output temperatures are noted).
# - Resource names use internal element ids: DirtyWater = Polluted Water,
#   ToxicSand = Polluted Dirt, Methane = Natural Gas, Carbon = Coal,
#   ContaminatedOxygen = Polluted Oxygen, OxyRock = Oxylite,
#   Polypropylene = Plastic, SlimeMold = Slime, BuildingWood = Wood.
# - 'LIQUID'/'GAS' in a machine name expands to one machine per element
#   (see machine.py:_expand_wildcards).

